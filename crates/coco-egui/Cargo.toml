[package]
name = "coco-egui"
version.workspace = true
edition = "2024"
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "cocovm"
path = "src/main.rs"

[dependencies]
# MIT OR Apache-2.0. Host local time for the Disto RTC's injected time source
# and the DriveWire server's OP_TIME clock (coco-core is deliberately
# std::time-free; the calendar/timezone lookup lives out here —
# `host_time_source` in main.rs).
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# `env` lets an `#[arg(env = …)]` fall back to an environment variable, which
# `load_dotenv` (startup.rs) seeds from the `.env` file.
clap = { version = "4.6.1", features = ["derive", "env"] }
coco-core = { path = "../coco-core" }
cpal = "0.18.1"
# MIT OR Apache-2.0. Encodes `screenshot` replies as base64 PNG data.
base64 = "0.22"
# MIT. Seeds the environment from a `.env` file at startup, so `RUST_LOG` and
# friends can be set per-checkout instead of per-shell (`load_dotenv` in
# startup.rs).
dotenvy = "0.15"
mc6809 = { path = "../mc6809" }
eframe = "0.33"
# MIT. Opts legacy Windows conhost into VT escape processing (no-op
# elsewhere); called once at the top of main().
enable-ansi-support = "0.3.1"
# MIT OR Apache-2.0. Per-user config/data directories: XDG on Linux & macOS,
# native convention on Windows (`paths.rs`).
etcetera = "0.11.0"
# MIT OR Apache-2.0. serde derives for the machine-definition DTOs
# (`machine_def.rs`); coco-core already depends on serde without `derive`.
serde = { version = "1", features = ["derive"] }
# MIT OR Apache-2.0. JSON-RPC message bodies for the built-in MCP server
# (`control/jsonrpc.rs`, `control/mcp.rs`, `control/tools.rs`).
serde_json = "1"
# MIT OR Apache-2.0. Compiles `wait_for_text` patterns once before the
# deferred screen matcher starts polling.
regex = "1"
# Both MIT OR Apache-2.0 (GPL-3.0-or-later-compatible); see
# `paper_export.rs`'s module doc comment for the PNG/PDF dependency
# rationale (T6). `flate2` is already resolved transitively through `image`'s
# `png` feature (`image` -> `png` -> `flate2`), so promoting it to a direct
# dependency here adds no new crate to the workspace's dependency graph.
flate2 = "1.1.9"
gilrs = "0.11.2"
image = { version = "0.25", default-features = false, features = ["png"] }
# MIT OR Apache-2.0. Streams long printer-roll PNGs one page at a time.
png = "0.18.0"
owo-colors = {version="4.3.0",  features = ["supports-colors"]}
rfd = "0.17.2"
# MIT OR Apache-2.0. Extracts the downloaded assets tarball
# (`unpack_assets` in main.rs); the gzip half comes from the earlier `flate2` entry.
tar = "0.4.46"
# Both MIT. Leveled, per-module-filterable logging (RUST_LOG) with colored
# level tags; subscriber initialized once in main.rs.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# MIT OR Apache-2.0. Human-editable machine-definition file format
# (`machine_def.rs`), read/written under `config_dir()/machines/<slug>.toml`.
toml = "0.9"
# MIT OR Apache-2.0. Comment-preserving TOML editing for the Settings dialog's
# write-back into `config.toml` (`config.rs::save_file`).
toml_edit = "0.25"
# MIT OR Apache-2.0. Blocking HTTP client for the first-run assets download
# (`download_and_unpack_assets` in main.rs).
ureq = "3.3.0"
pluralizer = "0.5.0"
# MIT OR Apache-2.0. Terminal column widths for wrapping the startup banner
# (`banner` in startup.rs). Small, no dependencies, and already in Cargo.lock
# through the `wgpu` feature (naga -> codespan-reporting).
unicode-width = "0.2"

# All MIT. Retarget the application menu's About item (`macos_menu.rs`).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSApplication", "NSMenu", "NSMenuItem", "NSResponder"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSArray", "NSString"] }

[features]
perf = []
debug-ui = []
# Off by default (the app ships on eframe's glow/OpenGL backend). Enabling
# this compiles eframe's wgpu backend in; `renderer_info` already has
# the matching arm reporting the wgpu adapter (backend/GPU name).
wgpu = ["eframe/wgpu"]

[dev-dependencies]
egui_kittest = { version = "0.33", features = ["eframe"] }
test-assets = { package = "cocovm-test-assets", path = "../test-assets" }
tms7000 = { path = "../tms7000" }

# MIT. Compiles `assets/cocovm.ico` and the version block into the Windows
# executable (`build.rs`), so Explorer shows the icon with no installer.
[target."cfg(windows)".build-dependencies]
winresource = "0.1"
