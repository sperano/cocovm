[package]
name = "cocovm-test-assets"
version.workspace = true
edition = "2024"
# Dev-dependency of the permissively dual-licensed `mc6809` crate as well as
# the rest of the (GPL-3.0-or-later) workspace, so it can't inherit the
# workspace default license — it needs to be usable under either.
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "test_assets"

[lints]
workspace = true

[dependencies]
etcetera = "0.11.0"
# On-demand download of the test-image bundle (`fetch.rs`); versions pinned
# to the app's so the lockfile carries one copy of each.
flate2 = "1.1.9"
tar = "0.4.46"
ureq = "3.3.0"
