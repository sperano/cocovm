[package]
name = "coco-mcp"
version.workspace = true
edition = "2024"
license.workspace = true
description = "MCP server (stdio) that lets an AI drive a running cocovm VM"

[lints]
workspace = true

[[bin]]
name = "cocovm-mcp"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.1", features = ["derive", "env"] }
coco-control = { path = "../coco-control" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
