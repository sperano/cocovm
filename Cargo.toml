[workspace]
resolver = "2"
members = [
    "crates/mc6809",
    "crates/tms7000",
    "crates/coco-core",
    "crates/coco-egui",
    "crates/test-assets",
]

[workspace.package]
version = "0.7.4"
license = "GPL-3.0-or-later"

[workspace.lints.clippy]
# Chip and signal names are spelled ALL CAPS everywhere in this codebase
# (MC6809, GIME, RGB, NTSC) — see CLAUDE.md.
upper_case_acronyms = "allow"

# Unoptimized, a running VM pins a core at 60 Hz: optimize everything but the
# frontend crate. Step-debug a core crate via --config 'profile.dev.package.<crate>.opt-level=0'.
[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.coco-core]
opt-level = 2

[profile.dev.package.mc6809]
opt-level = 2

[profile.dev.package.tms7000]
opt-level = 2
