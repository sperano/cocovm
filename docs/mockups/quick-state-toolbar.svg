<?xml version="1.0" ?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="695" viewBox="0 0 1000 695" role="img" aria-labelledby="title desc">
  <title id="title">Proposed save-state toolbar</title>
  <desc id="desc">A VM toolbar has Start, Suspend, Stop, Reset, Slot 1, Save, and Load controls. The slot menu lists three shared slots with dates or Empty.</desc>
  <defs>
    <g id="start" fill="currentColor">
      <path d="M-6-10 10 0-6 10Z"/>
    </g>
    <g id="pause" fill="currentColor">
      <rect x="-8" y="-10" width="5" height="20"/>
      <rect x="3" y="-10" width="5" height="20"/>
    </g>
    <g id="stop" fill="currentColor">
      <rect x="-9" y="-9" width="18" height="18" rx="1"/>
    </g>
    <g id="reset" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M8-5A10 10 0 1 1-6-8M-7-13v7h7"/>
    </g>
    <g id="save" fill="none" stroke="currentColor" stroke-width="2">
      <rect x="-13" y="-11" width="26" height="22" rx="2"/>
      <path d="M-8 6h16M0-7v10M-4-1 0 3 4-1"/>
    </g>
    <g id="load" fill="none" stroke="currentColor" stroke-width="2">
      <rect x="-13" y="-11" width="26" height="22" rx="2"/>
      <path d="M-8 6h16M0 3V-7M-4-3 0-7 4-3"/>
    </g>
    <g id="states" fill="none" stroke="currentColor" stroke-width="2">
      <rect x="-11" y="-9" width="22" height="18" rx="2"/>
      <path d="M-5-3H5M-5 3H5"/>
    </g>
  </defs>
  <g font-family="FreeSans, sans-serif">
    <rect x="0" y="0" width="1000" height="695" rx="0" fill="#181a1e" stroke="none"/>
    <text x="28" y="38" font-size="24" fill="#e3e5e8" text-anchor="start">Save states in the VM toolbar</text>
    <text x="28" y="64" font-size="14" fill="#a4acb8" text-anchor="start">Proposal · one-click save and restore with an explicit shared slot</text>
    <rect x="28" y="91" width="944" height="34" rx="4" fill="#202328" stroke="none"/>
    <text x="42" y="114" font-size="14" fill="#e3e5e8" text-anchor="start">CoCo 3 — VM window</text>
    <rect x="28" y="125" width="944" height="28" rx="4" fill="#24272c" stroke="none"/>
    <text x="42" y="144" font-size="12" fill="#e3e5e8" text-anchor="start">Machine     View     Help</text>
    <rect x="28" y="153" width="944" height="64" rx="4" fill="#24272c" stroke="none"/>
    <rect x="36" y="159" width="64" height="52" rx="4" fill="#282b30" stroke="none"/>
    <use href="#start" transform="translate(68.0 178)" color="#626975"/>
    <text x="68.0" y="202" font-size="11" fill="#626975" text-anchor="middle">Start</text>
    <rect x="102" y="159" width="64" height="52" rx="4" fill="#2f333a" stroke="none"/>
    <use href="#pause" transform="translate(134.0 178)" color="#e3e5e8"/>
    <text x="134.0" y="202" font-size="11" fill="#e3e5e8" text-anchor="middle">Suspend</text>
    <rect x="168" y="159" width="64" height="52" rx="4" fill="#2f333a" stroke="none"/>
    <use href="#stop" transform="translate(200.0 178)" color="#e3e5e8"/>
    <text x="200.0" y="202" font-size="11" fill="#e3e5e8" text-anchor="middle">Stop</text>
    <rect x="234" y="159" width="64" height="52" rx="4" fill="#2f333a" stroke="none"/>
    <use href="#reset" transform="translate(266.0 178)" color="#e3e5e8"/>
    <text x="266.0" y="202" font-size="11" fill="#e3e5e8" text-anchor="middle">Reset</text>
    <path d="M309 165v40" stroke="#505660"/>
    <rect x="322" y="159" width="108" height="52" rx="4" fill="#303b49" stroke="#657e9e"/>
    <text x="334" y="181" font-size="14" fill="#e3e5e8" text-anchor="start">Slot 1 ▾</text>
    <text x="334" y="199" font-size="11" fill="#a4acb8" text-anchor="start">Shared slots</text>
    <rect x="436" y="159" width="64" height="52" rx="4" fill="#2f333a" stroke="none"/>
    <use href="#save" transform="translate(468.0 178)" color="#e3e5e8"/>
    <text x="468.0" y="202" font-size="11" fill="#e3e5e8" text-anchor="middle">Save</text>
    <rect x="502" y="159" width="64" height="52" rx="4" fill="#2f333a" stroke="none"/>
    <use href="#load" transform="translate(534.0 178)" color="#e3e5e8"/>
    <text x="534.0" y="202" font-size="11" fill="#e3e5e8" text-anchor="middle">Load</text>
    <rect x="28" y="217" width="944" height="122" rx="4" fill="#10201a" stroke="none"/>
    <text x="54" y="263" font-size="16" fill="#83a98f" text-anchor="start">EMULATION DISPLAY</text>
    <text x="54" y="291" font-size="13" fill="#83a98f" text-anchor="start">Unchanged by the proposed toolbar layout</text>
    <rect x="28" y="339" width="944" height="29" rx="4" fill="#24272c" stroke="none"/>
    <text x="42" y="359" font-size="12" fill="#93bbef" text-anchor="start">State saved to slot 1</text>
    <text x="28" y="408" font-size="18" fill="#e3e5e8" text-anchor="start">Slot selector menu</text>
    <text x="28" y="433" font-size="14" fill="#a4acb8" text-anchor="start">Selecting a row changes the target; it does not save or load.</text>
    <rect x="28" y="453" width="400" height="174" rx="4" fill="#292d34" stroke="#596373"/>
    <text x="44" y="480" font-size="13" fill="#a4acb8" text-anchor="start">Shared across VM windows</text>
    <rect x="36" y="492" width="384" height="34" rx="4" fill="#3a4c64" stroke="none"/>
    <text x="48" y="514" font-size="14" fill="#e3e5e8" text-anchor="start">✓  Slot 1</text>
    <text x="185" y="514" font-size="14" fill="#a4acb8" text-anchor="start">2026-10-06 14:32</text>
    <text x="48" y="554" font-size="14" fill="#e3e5e8" text-anchor="start">    Slot 2</text>
    <text x="185" y="554" font-size="14" fill="#a4acb8" text-anchor="start">Empty</text>
    <text x="48" y="594" font-size="14" fill="#e3e5e8" text-anchor="start">    Slot 3</text>
    <text x="185" y="594" font-size="14" fill="#a4acb8" text-anchor="start">2026-10-06 14:10</text>
    <text x="466" y="480" font-size="15" fill="#e3e5e8" text-anchor="start">Save replaces the selected saved state.</text>
    <text x="466" y="513" font-size="15" fill="#e3e5e8" text-anchor="start">Load replaces the current machine state.</text>
    <text x="466" y="551" font-size="14" fill="#a4acb8" text-anchor="start">Numbered shortcuts keep their existing targets.</text>
    <text x="466" y="582" font-size="14" fill="#a4acb8" text-anchor="start">The optional Debug tile follows this group.</text>
    <text x="28" y="668" font-size="12" fill="#a4acb8" text-anchor="start">Illustrative layout · final icons and theme colors follow the existing toolbar</text>
  </g>
</svg>
